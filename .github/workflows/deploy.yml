name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'src/wrecksys_one/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/wrecksys_one
          push: true
          tags: |
            ${{ secrets.ECR_REPO }}:latest
            ${{ secrets.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get runner IP
        id: ip
        run: echo "addr=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32

      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ECR_REPO="${{ secrets.ECR_REPO }}"
            REGISTRY="${ECR_REPO%%/*}"
            PREV=$(docker ps --filter "name=wrecksys" --format "{{.ID}}" -a)
            if [ -n "$PREV" ]; then
              docker stop wrecksys
              docker rm $PREV
            fi
            aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $REGISTRY
            docker pull $ECR_REPO:${{ needs.build.outputs.image-tag }}
            docker run -d -p 3000:3000 --name wrecksys --restart always $ECR_REPO:${{ needs.build.outputs.image-tag }}

      - name: Health check
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in 1 2 3 4 5; do
              if curl -sf --max-time 5 http://localhost:3000 > /dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              echo "Attempt $i — waiting 5s..."
              sleep 5
            done
            echo "Health check failed after 5 attempts"
            exit 1

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32 || true
