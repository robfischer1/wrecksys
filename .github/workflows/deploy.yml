name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'src/wrecksys_one/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPO: 757938331536.dkr.ecr.us-east-2.amazonaws.com/wrecksys
  SG_ID: sg-0e4e76a0b817631db

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: src/wrecksys_one
        run: |
          docker build -t wrecksys .
          docker tag wrecksys:latest ${{ env.ECR_REPO }}:latest
          docker push ${{ env.ECR_REPO }}:latest

      - name: Get runner IP
        id: ip
        run: echo "addr=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32 \
            --tag-specifications 'ResourceType=security-group-rule,Tags=[{Key=Name,Value=github-actions-temp}]'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            PREV=$(docker ps --filter "name=wrecksys" --format "{{.ID}}" -a)
            if [ -n "$PREV" ]; then
              docker stop wrecksys
              docker rm $PREV
            fi
            aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 757938331536.dkr.ecr.us-east-2.amazonaws.com
            docker pull 757938331536.dkr.ecr.us-east-2.amazonaws.com/wrecksys:latest
            docker run -d -p 3000:3000 --name wrecksys --restart always 757938331536.dkr.ecr.us-east-2.amazonaws.com/wrecksys:latest

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32 || true
