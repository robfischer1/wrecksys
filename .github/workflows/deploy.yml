name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'src/wrecksys_one/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/wrecksys_one
          push: true
          tags: |
            ${{ secrets.ECR_REPO }}:latest
            ${{ secrets.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get runner IP
        id: ip
        run: echo "addr=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ECR_REPO="${{ secrets.ECR_REPO }}"
            REGISTRY="${ECR_REPO%%/*}"
            PREV=$(docker ps --filter "name=wrecksys" --format "{{.ID}}" -a)
            if [ -n "$PREV" ]; then
              docker stop wrecksys
              docker rm $PREV
            fi
            aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $REGISTRY
            docker pull $ECR_REPO:latest
            docker run -d -p 3000:3000 --name wrecksys --restart always $ECR_REPO:latest

      - name: Health check
        run: |
          echo "Waiting for container to start..."
          sleep 10
          for i in 1 2 3 4 5; do
            if curl -sfk --max-time 5 https://${{ secrets.EC2_HOST }} > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Health check failed after 5 attempts — container may still be starting"

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32 || true

      - name: Clean up old IAM access keys
        if: false
        run: echo "Static IAM keys replaced by OIDC — delete github-actions-wrecksys user when confirmed working"
