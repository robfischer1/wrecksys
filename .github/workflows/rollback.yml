name: Rollback deployment

on:
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'Git commit SHA of the image to deploy (must exist in ECR)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name wrecksys \
            --image-ids imageTag=${{ inputs.commit-sha }} \
            --region ${{ env.AWS_REGION }}

      - name: Get runner IP
        id: ip
        run: echo "addr=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32

      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ECR_REPO="${{ secrets.ECR_REPO }}"
            REGISTRY="${ECR_REPO%%/*}"
            PREV=$(docker ps --filter "name=wrecksys" --format "{{.ID}}" -a)
            if [ -n "$PREV" ]; then
              docker stop wrecksys
              docker rm $PREV
            fi
            aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $REGISTRY
            docker pull $ECR_REPO:${{ inputs.commit-sha }}
            docker run -d -p 3000:3000 --name wrecksys --restart always $ECR_REPO:${{ inputs.commit-sha }}

      - name: Health check
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in 1 2 3 4 5; do
              if curl -sf --max-time 5 http://localhost:3000 > /dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              echo "Attempt $i — waiting 5s..."
              sleep 5
            done
            echo "Health check failed after 5 attempts"
            exit 1

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32 || true
