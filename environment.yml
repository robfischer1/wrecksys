name: wrecksys-capstone
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pandas=2.1.3
  - pyarrow=14.0.1
  - numpy
  - seaborn>=0.13.0
  - matplotlib
  - notebook>=7.*
  - ipywidgets
  - fsspec
  - tqdm
  - requests
  - aiohttp
  - pip:
    - tensorflow; sys_platform == "win32"
    - tensorflow-gpu; sys_platform == "linux"
  - nodejs
  - yarn
